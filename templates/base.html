<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}ThreatLens{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><script defer src="{{ url_for('static', filename='app.js') }}"></script></head>
<body><header><a class="brand" href="{{ url_for('dashboard') }}"><span class="brand-icon">◈</span> ThreatLens<span class="version">V1</span></a><div class="header-right">{% if session.get('user') %}<span>{{ session.user }}</span><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ session.csrf }}"><button class="text-button">Sign out ↗</button></form>{% else %}<span class="status-dot"></span> URL THREAT INTELLIGENCE{% endif %}</div></header>{% block content %}{% endblock %}<footer><span>ThreatLens / See the risk before you click.</span><span>Powered by VirusTotal & custom rules</span></footer></body></html>
